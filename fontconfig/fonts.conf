<?xml version="1.0" ?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Pull in any fragments dropped into conf.d/. -->
  <include ignore_missing="yes">conf.d</include>

  <!-- Rendering: subpixel + autohint, no extra hinting (looks best on
       modern LCD/HiDPI). -->
  <match target="font">
    <edit mode="assign" name="rgba"><const>rgb</const></edit>
    <edit mode="assign" name="hinting"><bool>true</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
    <edit mode="assign" name="autohint"><bool>false</bool></edit>
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
  </match>

  <!-- DPI hint for tooling that doesn't query Wayland (Sway sets actual scale
       via output {scale 1}/etc). -->
  <match target="pattern">
    <edit name="dpi" mode="assign"><double>109</double></edit>
  </match>

  <!-- =========================================================
       Default family aliases — single source of truth.
       ========================================================= -->

  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrains Mono</family>
      <family>SauceCodePro Nerd Font</family>
      <family>Source Code Pro</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Noto Sans</family>
      <family>DejaVu Sans</family>
      <family>Liberation Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Liberation Serif</family>
      <family>DejaVu Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Convenience alias for terminals/Waybar that ask for "terminal-font". -->
  <alias>
    <family>terminal-font</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
