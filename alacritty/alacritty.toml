# Alacritty config — Solarized Dark, JetBrainsMono Nerd Font.
# Docs: https://alacritty.org/config-alacritty.html

[general]
live_config_reload = true

[env]
TERM = "alacritty"

# ---------------------------------------------------------------- window ----
[window]
decorations = "none"
dynamic_padding = true
dynamic_title = true
opacity = 0.95
title = "Alacritty"

[window.padding]
x = 8
y = 8

# ------------------------------------------------------------------ font ----
[font]
size = 11
builtin_box_drawing = true

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 1

# --------------------------------------------------------------- scrolling --
[scrolling]
history = 100000
multiplier = 3

# ----------------------------------------------------------------- mouse ----
[mouse]
hide_when_typing = true

# ------------------------------------------------------------- selection ----
[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# --------------------------------------------------------------- cursor ----
[cursor]
vi_mode_style = "Block"
unfocused_hollow = true

[cursor.style]
shape = "Block"
blinking = "On"

# ----------------------------------------------------------------- bell ----
[bell]
animation = "EaseOutExpo"
duration = 100
color = "#268bd2"

# ---------------------------------------------------------------- colors ----
# Solarized Dark — https://ethanschoonover.com/solarized
[colors.primary]
background = "#002b36"  # base03
foreground = "#93a1a1"  # base1

[colors.cursor]
text   = "#002b36"
cursor = "#93a1a1"

[colors.vi_mode_cursor]
text   = "#002b36"
cursor = "#268bd2"

[colors.search.matches]
foreground = "#002b36"
background = "#b58900"  # yellow

[colors.search.focused_match]
foreground = "#002b36"
background = "#dc322f"  # red

[colors.footer_bar]
foreground = "#93a1a1"
background = "#073642"  # base02

[colors.line_indicator]
foreground = "None"
background = "None"

[colors.selection]
text       = "#002b36"
background = "#93a1a1"

[colors.normal]
black   = "#073642"     # base02
red     = "#dc322f"
green   = "#859900"
yellow  = "#b58900"
blue    = "#268bd2"
magenta = "#6c71c4"
cyan    = "#2aa198"
white   = "#eee8d5"     # base2

[colors.bright]
black   = "#002b36"     # base03
red     = "#cb4b16"     # orange
green   = "#586e75"     # base01
yellow  = "#657b83"     # base00
blue    = "#839496"     # base0
magenta = "#6c71c4"
cyan    = "#93a1a1"     # base1
white   = "#fdf6e3"     # base3

[[colors.indexed_colors]]
index = 16
color = "#cb4b16"
[[colors.indexed_colors]]
index = 17
color = "#d33682"
[[colors.indexed_colors]]
index = 18
color = "#073642"
[[colors.indexed_colors]]
index = 19
color = "#586e75"
[[colors.indexed_colors]]
index = 20
color = "#839496"
[[colors.indexed_colors]]
index = 21
color = "#eee8d5"

# -------------------------------------------------------------- keybinds ----
# Defaults remain; only overrides + niceties live here.
[keyboard]
bindings = [
  # clipboard
  { key = "C", mods = "Control|Shift",       action = "Copy"  },
  { key = "V", mods = "Control|Shift",       action = "Paste" },
  { key = "C", mods = "Super",               action = "Copy"  },
  { key = "V", mods = "Super",               action = "Paste" },

  # font size
  { key = "Equals", mods = "Control",        action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Control",        action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Control",        action = "ResetFontSize"    },
  { key = "Equals", mods = "Super",          action = "IncreaseFontSize" },
  { key = "Minus",  mods = "Super",          action = "DecreaseFontSize" },
  { key = "Key0",   mods = "Super",          action = "ResetFontSize"    },

  # window
  { key = "Q",      mods = "Super",          action = "Quit" },
  { key = "W",      mods = "Super",          action = "Quit" },
  { key = "N",      mods = "Control|Shift",  action = "SpawnNewInstance" },
  { key = "F11",    mods = "None",           action = "ToggleFullscreen" },

  # scroll
  { key = "End",    mods = "Shift",          action = "ScrollToBottom" },
  { key = "Home",   mods = "Shift",          action = "ScrollToTop"    },
  { key = "PageUp", mods = "Shift",          action = "ScrollPageUp"   },
  { key = "PageDown", mods = "Shift",        action = "ScrollPageDown" },

  # vi mode
  { key = "Space",  mods = "Control|Shift",  action = "ToggleViMode" },
  { key = "LBracket", mods = "Control|Alt",  action = "ToggleViMode" },

  # vi-mode movements (only active in vi mode)
  { key = "Q",      mode = "Vi",             action = "ToggleViMode" },
  { key = "H",      mods = "Shift", mode = "Vi", action = "First" },
  { key = "L",      mods = "Shift", mode = "Vi", action = "Last"  },

  # search
  { key = "F",      mods = "Control|Shift",  action = "SearchForward"  },
  { key = "B",      mods = "Control|Shift",  action = "SearchBackward" },
]
