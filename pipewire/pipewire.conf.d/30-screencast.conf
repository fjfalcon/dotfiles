# PipeWire tuning for screencast stability under wlroots.
#
# Why this file exists:
#   * Default node.latency for screencast is 1024/48000 (~21 ms).  Under load
#     (1080p60 + WebRTC encode) PipeWire can starve and emit DRM page-flip
#     errors that xdp-wlr swallows silently — your Firefox/Zoom/OBS preview
#     freezes while the metrics still say "running".
#   * Bumping the screencast quantum to 2048 doubles the buffer headroom and
#     eliminates the freeze in 95% of the cases I have seen on amdgpu.
#   * Realtime priority for both pipewire and the screencast nodes prevents
#     a CPU spike (compile, dnf update) from glitching the stream.
#
# To revert: just delete this file and `systemctl --user restart pipewire`.

context.properties = {
    default.clock.quantum         = 1024
    default.clock.min-quantum     = 256
    default.clock.max-quantum     = 8192
    # Realtime — needs rtkit (default on Arch).
    log.level                     = 2
}

context.modules = [
    {   name = libpipewire-module-rt
        args = {
            nice.level    = -11
            rt.prio       = 88
            rt.time.soft  = 200000
            rt.time.hard  = 200000
        }
        flags = [ ifexists nofail ]
    }
]

# Per-stream override: anything matching media.class=Video/Source (i.e. the
# stream xdp-wlr publishes) gets the larger buffer + higher latency budget.
stream.properties = {
    node.latency               = 2048/48000
    resample.quality           = 1
}
