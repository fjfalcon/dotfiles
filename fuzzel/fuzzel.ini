# fuzzel — app launcher.  Run with:  fuzzel
# Solarized Dark, JetBrainsMono Nerd Font.

font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes
prompt=" "
icon-theme=Adwaita
icons-enabled=yes
fields=name,generic,comment,categories,filename,keywords
terminal=alacritty -e
layer=overlay
exit-on-keyboard-focus-loss=yes
lines=14
width=42
horizontal-pad=18
vertical-pad=12
inner-pad=8
tabs=4

[border]
width=2
radius=12

[colors]
# Solarized Dark
background=002b36ee
text=eee8d5ff
match=2aa198ff
selection=073642ff
selection-text=eee8d5ff
selection-match=b58900ff
border=268bd2ff
prompt=859900ff
input=eee8d5ff
counter=586e75ff
placeholder=586e75ff

[key-bindings]
cancel=Escape Control+c Control+g
execute=Return KP_Enter
execute-or-next=Tab
cursor-left=Left Control+b
cursor-left-word=Control+Left Mod1+b
cursor-right=Right Control+f
cursor-right-word=Control+Right Mod1+f
cursor-home=Home Control+a
cursor-end=End Control+e
delete-prev=BackSpace
delete-prev-word=Mod1+BackSpace Control+BackSpace
delete-next=Delete KP_Delete
delete-next-word=Mod1+d Control+Delete
delete-line=Control+u
delete-line-forward=Control+k
prev=Up Control+p
prev-with-history=Control+r
next=Down Control+n
next-with-history=Control+s
