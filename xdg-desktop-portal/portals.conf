# xdg-desktop-portal routing for sway.
#
# Why explicit per-interface routing?
#   * `default=wlr` is wrong: wlr implements only ScreenCast + Screenshot.
#     Everything else falls back to "last-resort" pickers and the route gets
#     non-deterministic — including ScreenCast getting hijacked by gtk on
#     subsequent sessions when wlr's process is briefly down.
#   * Mirrors /usr/share/xdg-desktop-portal/sway-portals.conf but kept here
#     to stay version-controlled.

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# sway speaks idle-inhibit-unstable-v1 natively — disable the gtk impl to
# avoid double-inhibit (Firefox, mpv, etc. were getting double sessions).
org.freedesktop.impl.portal.Inhibit=none
